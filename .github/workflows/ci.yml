name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        # -short and no DEEPSEEK_API_KEY: the tests that call the real API skip.
        run: go test -short -race ./...
      - name: build
        if: matrix.os == 'ubuntu-latest'
        run: go tool mygo build -platform darwin/universal
